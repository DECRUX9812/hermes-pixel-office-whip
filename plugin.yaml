name: pixel-office
version: "0.3.0"
description: "Pixel-art virtual office for Hermes — watch agents work, then harmlessly whip their pixel characters for fun. Visual only; observes lifecycle hooks, never blocks or transforms anything."
author: "NousResearch + Ritesh Patel"
hooks:
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - on_session_start
  - on_session_end
  - pre_approval_request
  - post_approval_response
