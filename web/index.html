<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hermes 3D Office</title>
<style>
:root{color-scheme:dark;--bg:#090711;--panel:rgba(13,10,23,.82);--line:rgba(151,112,255,.3);--gold:#f4c85f;--purple:#a98cff;--cyan:#28e9ff;--green:#25e58a;--pink:#ff57bc;--muted:#827a9b}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#edeaff}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;position:relative;background:radial-gradient(circle at 70% 30%,#1e1135 0,#090711 55%)}
header{height:48px;display:flex;align-items:center;gap:9px;padding:0 13px;border-bottom:1px solid var(--line);background:rgba(8,6,14,.9);backdrop-filter:blur(16px);z-index:20;box-shadow:0 6px 28px rgba(0,0,0,.28)}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;font-weight:800;letter-spacing:.11em;font-size:12px;color:var(--gold)}
.mark{width:25px;height:25px;border:1px solid rgba(244,200,95,.7);display:grid;place-items:center;transform:rotate(45deg);box-shadow:0 0 18px rgba(244,200,95,.22)}.mark span{transform:rotate(-45deg);font-size:14px}.spacer{flex:1}
.badge,.control{height:27px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:rgba(30,22,48,.72);font:700 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.06em;color:#c9c0df;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--green);box-shadow:0 0 8px var(--green)}
.control{cursor:pointer;transition:.16s ease;user-select:none}.control:hover{color:white;border-color:rgba(169,140,255,.72);transform:translateY(-1px)}.control.active{color:var(--green);border-color:rgba(37,229,138,.55);background:rgba(16,52,41,.72)}.control.armed{color:#1a1011;border-color:var(--gold);background:var(--gold);box-shadow:0 0 22px rgba(244,200,95,.28)}
#stage{position:relative;min-height:0;overflow:hidden}#world{display:block;width:100%;height:100%;cursor:grab}#world:active{cursor:grabbing}
.tip{position:absolute;left:14px;bottom:13px;z-index:10;display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid rgba(151,112,255,.24);border-radius:8px;background:rgba(8,6,15,.72);backdrop-filter:blur(12px);font:600 10px ui-monospace,monospace;color:var(--muted);pointer-events:none}.tip b{color:var(--purple)}
.legend{position:absolute;right:14px;bottom:13px;z-index:10;padding:8px 11px;border:1px solid rgba(151,112,255,.24);border-radius:8px;background:rgba(8,6,15,.72);backdrop-filter:blur(12px);font:600 9px ui-monospace,monospace;color:var(--muted);pointer-events:none}.legend span{color:var(--cyan)}
#fatal{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle,#24183a,#090711 64%)}#fatal[hidden]{display:none}.fatal-card{max-width:470px;margin:20px;padding:28px;border:1px solid rgba(255,87,188,.5);border-radius:15px;background:rgba(17,11,29,.94);box-shadow:0 24px 90px rgba(0,0,0,.6);text-align:center}.fatal-card strong{display:block;color:var(--pink);font-size:20px}.fatal-card span{display:block;margin:10px 0 18px;color:#a9a0bc;font:12px ui-monospace,monospace}.fatal-card a{display:inline-flex;padding:9px 13px;border-radius:8px;background:var(--purple);color:#100b19;text-decoration:none;font-weight:800;font-size:12px}
.offline{color:#ff647c}.offline::before{background:#ff647c;box-shadow:0 0 8px #ff647c}
@media(max-width:760px){header{height:auto;min-height:48px;flex-wrap:wrap;padding:8px}.brand{width:100%}.spacer{display:none}.tip{display:none}.control,.badge{height:25px;padding:0 7px;font-size:9px}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><div class="mark"><span>☤</span></div><span>HERMES 3D OFFICE</span></div>
  <div class="badge" id="mode">3D · BOOTING</div>
  <div class="spacer"></div>
  <div class="badge" id="count">CONNECTING</div>
  <button class="control" id="sound" type="button">♪ SOUND OFF</button>
  <button class="control" id="voice" type="button">VOICE OFF</button>
  <button class="control" id="whip" type="button">WHIP</button>
  <button class="control" id="reset" type="button">RESET VIEW</button>
  <button class="control" id="pixel" type="button">2D FALLBACK</button>
</header>
<main id="stage" aria-label="Live three-dimensional Hermes agent office">
  <div class="tip"><b>DRAG</b> orbit · <b>SCROLL</b> zoom · arm <b>WHIP</b> then click an employee</div>
  <div class="legend"><span>LIVE</span> lifecycle visualization · harmless presentation layer</div>
  <div id="fatal" hidden><div class="fatal-card"><strong></strong><span></span><a href="pixel.html">Open proven pixel office</a></div></div>
</main>
</div>
<script type="module" src="office3d.mjs"></script>
</body>
</html>
