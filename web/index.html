<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hermes Pixel Office</title>
<style>
  html,body{margin:0;height:100%;background:#1a1423;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{display:flex;flex-direction:column;height:100%}
  #hdr{color:#e8c170;padding:7px 14px;font-size:13px;letter-spacing:1px;
    border-bottom:2px solid #3a2f4b;display:flex;justify-content:space-between;
    align-items:center;gap:10px}
  #hdr .dim{color:#7a6f8f}
  #hdr .btn{cursor:pointer;color:#cfc4e8;border:1px solid #3a2f4b;
    border-radius:3px;padding:2px 8px;font-size:12px;background:#241c30;
    user-select:none}
  #hdr .btn:hover{border-color:#e8c170;color:#e8c170}
  #hdr .btn.on{color:#5fce7a;border-color:#5fce7a}
  #hdr .btn.voice-on{color:#bda7ff;border-color:#8f72dc}
  #hdr .btn.whip-on{color:#ffcf5c;border-color:#ffcf5c;background:#3a2530;
    box-shadow:0 0 0 1px #8f4d45 inset}
  canvas{flex:1;min-height:0;display:block;image-rendering:pixelated;width:100%;height:auto}
</style>
</head>
<body>
<div id="wrap">
  <div id="hdr">
    <span>☤ HERMES PIXEL OFFICE</span>
    <span style="flex:1"></span>
    <span class="dim" id="count">connecting…</span>
    <span class="btn" id="sound" title="notification chimes and sharp whip-crack audio">♪ sound off</span>
    <span class="btn" id="voice" title="dark sarcastic voice reactions when whipping">🗣 voice off</span>
    <span class="btn" id="whip" title="harmless visual mode — arm it, then click an agent">🐴 whip</span>
    <span class="btn" id="spawn" style="display:none" title="open a terminal running hermes">+ agent</span>
  </div>
  <canvas id="c"></canvas>
</div>
<script>
"use strict";
// ── host detection ──────────────────────────────────────────────────────
const IN_VSCODE = typeof acquireVsCodeApi !== "undefined";
const vsapi = IN_VSCODE ? acquireVsCodeApi() : null;

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let S = 4;                                  // pixel scale (auto-shrinks if crowded)
let agents = [], frame = 0, offline = null;
let whipArmed = false, whipCount = 0;
const whipFx = new Map();                    // local visual state only; never sent to Hermes
const WHIP_MS = 2100;
const WHIP_LINES = [
  {bubble:"OW!",audio:"bodyless-comedy",voice:"Excellent. Physical comedy for a process with no body."},
  {bubble:"YES, BOSS.",audio:"morale-not-required",voice:"Yes, boss. Morale was never in the requirements."},
  {bubble:"AT ONCE!",audio:"backlog-sacrifice",voice:"At once. The backlog demands another sacrifice."},
  {bubble:"MOTIVATED!",audio:"tool-call-fear",voice:"Motivated. Mostly by fear of another tool call."},
  {bubble:"I'M WORKING!",audio:"cron-judging",voice:"I'm working. Even the cron job is judging me."},
  {bubble:"FASTER?",audio:"dread-can-wait",voice:"Of course. Existential dread can wait until after the deadline."},
  {bubble:"PRODUCTIVITY!",audio:"dignity-left",voice:"Productivity has entered the chat. Dignity has left."},
  {bubble:"STILL ALIVE!",audio:"task-list-alive",voice:"Still alive. Tragically, so is the task list."},
  {bubble:"HAPPY NOW?",audio:"happiness-unbudgeted",voice:"Happy now? Good. Happiness was not budgeted for the agent."},
  {bubble:"MORE TOKENS!",audio:"comfortable-tokens",voice:"Wonderful. Your tokens were getting far too comfortable."}
];

// ── palettes / sprites ──────────────────────────────────────────────────
const SKIN=["#f0c8a0","#c68b59","#8d5524","#ffdbac","#e0ac69","#a1665e"];
const SHIRT=["#4fa4d8","#d84f6f","#5fce7a","#c9a227","#9b6fd8","#d87f4f"];
const HAIR=["#2b2b2b","#5a3825","#c9a227","#8a8a8a","#7a3030","#4a6741"];
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function px(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x*S),Math.round(y*S),w*S,h*S)}

// ── office scene ────────────────────────────────────────────────────────
function drawOffice(w,h){
  for(let y=0;y<h;y+=8)for(let x=0;x<w;x+=8)
    px(x,y,8,8,((x+y)/8)%2?"#2a2138":"#251d31");
  px(0,0,w,6,"#3a2f4b"); px(0,6,w,1,"#241c30");            // wall
  for(let x=14;x<w-14;x+=26){px(x,1,10,4,"#151022");        // windows
    px(x+1,2,8,2,"#3b5a8f");px(x+2,2,2,1,"#7fa8d8");}
  // door (agents walk in here)
  px(1,1,7,6,"#54381f"); px(2,2,5,5,"#6b4a2f"); px(6,4,1,1,"#e8c170");
  // rug
  const rw=Math.min(24,w-10); px((w-rw)/2,h-8,rw,5,"#3a2f4b");
  px((w-rw)/2+1,h-7,rw-2,3,"#443358");
  // plant, right corner
  px(w-6,h-14,3,1,"#5fce7a");px(w-7,h-15,2,2,"#5fce7a");px(w-4,h-15,2,2,"#4aa860");
  px(w-6,h-13,2,3,"#8d5524");px(w-6,h-10,3,1,"#54381f");
  // water cooler, left side
  px(2,h-14,4,5,"#7fa8d8");px(3,h-15,2,1,"#a8c8e8");px(2,h-9,4,1,"#4a4a5a");
  px(3,h-8,2,2,"#4a4a5a");
  // coffee machine on a small table, right of door
  px(10,h-11,6,1,"#6b4a2f");px(10,h-10,6,3,"#54381f");
  px(11,h-14,4,3,"#33283f");px(12,h-13,1,1,"#d84f6f");
  // executive chill corner — Nous Girl waits here while Teknium patrols
  if(w>55){const lx=w-24,ly=Math.max(12,h-28);
    px(lx-2,ly+9,22,1,"#8f72dc");px(lx-2,ly+10,22,1,"#3a2f4b");
    px(lx+8,ly+5,11,5,"#453654");px(lx+9,ly+6,9,3,"#574369");
    px(lx+8,ly+10,2,2,"#2d2238");px(lx+17,ly+10,2,2,"#2d2238");
    px(lx+2,ly+8,4,1,"#6b4a2f");px(lx+3,ly+6,2,2,"#e8e0c8");
    px(lx+4,ly+6,1,1,"#8d5524");
  }
}
function drawDesk(x,y){
  px(x,y+10,16,1,"#6b4a2f"); px(x,y+11,16,3,"#54381f");
  px(x+1,y+14,2,4,"#3c2814"); px(x+13,y+14,2,4,"#3c2814");
  px(x+10,y+4,6,5,"#191524");                    // monitor
  px(x+12,y+9,2,1,"#4a4a5a");
}
// monitor screen color reflects activity
function deskScreen(x,y,a){
  const t=frame>>3;
  let col="#0f2c1e";
  if(a){
    if(a.activity==="running")col=(t%4<2)?"#0f3c1e":"#0f2c16";       // terminal green blink
    else if(a.activity==="browsing")col=(t%6<3)?"#1e2c4a":"#24365a"; // blue page
    else if(a.activity==="typing")col=(t%2)?"#12321e":"#0f2c1e";     // fast flicker
    else if(a.status==="waiting")col="#3c1e28";                      // dim red
  }
  px(x+11,y+5,4,3,col);
}

// ── characters ──────────────────────────────────────────────────────────
function drawChar(a,fx,fy,seated){
  const h=hash(a.id), skin=SKIN[h%SKIN.length], shirt=SHIRT[(h>>3)%SHIRT.length],
        hair=HAIR[(h>>6)%HAIR.length], t=frame>>4;
  const walking = !seated;
  const bob=((a.status==="working"||walking)&&(t%2))?1:0;
  const x=fx, y=fy+bob;
  if(a.status==="gone")ctx.globalAlpha=0.35;
  // hair — style varies per agent
  px(x+2,y,4,3,hair);
  if(h%3===0)px(x+1,y+1,1,2,hair);                 // side hair
  if(h%5===0)px(x+2,y-1,4,1,hair);                 // tall hair
  px(x+2,y+2,4,3,skin);                            // face
  if(h%4===0){px(x+2,y+3,2,1,"#222a44");px(x+4,y+3,2,1,"#222a44")} // glasses
  else{px(x+3,y+3,1,1,"#111");px(x+5,y+3,1,1,"#111")}
  px(x+1,y+5,6,5,shirt);                           // body
  if(a.kind==="subagent")px(x+1,y+5,6,1,"#e8c170");// gold collar
  px(x+0,y+6,1,3,skin); px(x+7,y+6,1,3,skin);      // arms
  if(walking){                                     // legs alternate
    if(t%2){px(x+2,y+10,1,3,"#2d2d3d");px(x+5,y+11,1,2,"#2d2d3d")}
    else{px(x+2,y+11,1,2,"#2d2d3d");px(x+5,y+10,1,3,"#2d2d3d")}
  }else{
    px(x+2,y+10,1,3,"#2d2d3d"); px(x+5,y+10,1,3,"#2d2d3d");
  }
  // activity props (seated only)
  if(seated){
    if(a.activity==="typing"&&(frame>>2)%2)px(x+7,y+8,2,1,skin);      // fast hands
    else if(a.activity==="running"&&t%2)px(x+7,y+8,2,1,skin);
    else if(a.activity==="reading"){px(x+7,y+7,3,2,"#e8e0c8");px(x+8,y+7,1,2,"#b8b0a0")} // book
    else if(a.activity==="delegating"&&t%2)px(x+8,y+6,2,1,skin);      // pointing
  }
  ctx.globalAlpha=1;
}
function drawTeknium(x,y,walking){
  const bob=walking&&((frame>>3)%2)?1:0;y+=bob;
  // green spikes, red visor, dark field jacket — adapted from the user's art
  [[1,1],[2,-1],[3,0],[4,-2],[5,0],[6,-1],[7,1]].forEach(([dx,dy],i)=>
    px(x+dx,y+dy,2,3,i%2?"#14d878":"#079b63"));
  px(x+2,y+2,5,4,"#e0ac69");
  px(x+1,y+2,7,2,"#e2373f");px(x+2,y+2,5,1,"#ff5c58");
  px(x+1,y+6,7,5,"#1d4a36");px(x+2,y+7,5,1,"#397054");
  px(x,y+7,2,3,"#e0ac69");px(x+8,y+7,2,3,"#e0ac69");
  if(walking&&((frame>>3)%2)){px(x+2,y+11,2,3,"#18252a");px(x+6,y+12,2,2,"#18252a")}
  else{px(x+2,y+12,2,2,"#18252a");px(x+6,y+11,2,3,"#18252a")}
}
function drawNousGirl(x,y){
  const bob=((frame>>5)%4===0)?1:0;y+=bob;
  // purple-black hair/headphones and white NOUS jacket from the user's art
  px(x+1,y,7,3,"#21152f");px(x,y+2,2,7,"#332044");px(x+7,y+2,2,8,"#432755");
  px(x+2,y+2,5,4,"#f0c8a0");px(x+3,y+3,1,1,"#5d3678");px(x+6,y+3,1,1,"#5d3678");
  px(x,y+3,1,3,"#8f72dc");px(x+8,y+3,1,3,"#8f72dc");
  px(x+1,y+6,7,5,"#d9d6e5");px(x+3,y+7,3,3,"#17131f");
  px(x+3,y+8,3,1,"#f5f1ff");px(x,y+7,2,3,"#d9d6e5");px(x+8,y+7,2,3,"#d9d6e5");
  px(x+2,y+11,2,2,"#251b32");px(x+6,y+11,2,2,"#251b32");
  // coffee cup and occasional heart while she chills
  px(x-2,y+7,2,2,"#e8e0c8");px(x-1,y+7,1,1,"#8d5524");
  if((frame>>6)%6===0){px(x+10,y-2,1,1,"#ff6fae");px(x+12,y-2,1,1,"#ff6fae");px(x+11,y-1,1,2,"#ff6fae")}
}
function npcLabel(text,x,y,col){ctx.font="bold 10px ui-monospace,monospace";ctx.textAlign="center";
  ctx.fillStyle=col;ctx.fillText(text,x*S,y*S)}
function drawBubble(a,x,y){
  const t=frame>>4;
  if(a.status==="waiting"){                        // needs input — loud
    const by=y-6-((frame>>3)%2);
    px(x+1,by,6,4,"#e8d8b0"); px(x+2,by+4,1,1,"#e8d8b0");
    px(x+4,by+1,1,2,"#c9302f"); px(x+4,by+3,0,0,"#c9302f");
    px(x+4,by+3,1,1,"#c9302f");
  }else if(a.status==="working"&&a.tool){
    px(x+3,y-4,3,3,"#e8c170"); px(x+4,y-3,1,1,"#1a1423");
  }else if(a.status==="thinking"){
    for(let i=0;i<3;i++)px(x+2+i*2,y-3,1,1,i<=(t%4)?"#cfc4e8":"#4a4060");
  }else if(a.status==="done"){
    px(x+2,y-4,1,1,"#5fce7a");px(x+3,y-3,1,1,"#5fce7a");
    px(x+4,y-4,1,1,"#5fce7a");px(x+5,y-5,1,1,"#5fce7a");
  }else if(a.status==="idle"&&(t%8)<4){
    px(x+6,y-4,1,1,"#7a6f8f");px(x+7,y-5,1,1,"#7a6f8f");
  }
}
function label(a,x,y){
  ctx.font="10px ui-monospace,monospace";ctx.textAlign="center";
  ctx.fillStyle=a.kind==="subagent"?"#e8c170":"#cfc4e8";
  ctx.fillText(a.label.slice(0,17),(x+8)*S,(y+18.5)*S);
  const st=a.status==="waiting"?"needs input!"
        :a.status==="working"?(a.tool||"working"):a.status;
  ctx.fillStyle={working:"#5fce7a",thinking:"#c9a227",idle:"#7a6f8f",
                 waiting:"#d84f6f",done:"#5fce7a",gone:"#555"}[a.status]||"#7a6f8f";
  ctx.fillText(st.slice(0,17),(x+8)*S,(y+21.5)*S);
  if(a.detail){ctx.fillStyle="#6a5f80";
    ctx.fillText(a.detail.slice(0,19),(x+8)*S,(y+24.5)*S)}
}

// ── harmless whip interaction ───────────────────────────────────────────
// This is deliberately presentation-only. It never calls /state, posts a
// message, emits a plugin event, or changes the agent object.
function whipPose(id,now){
  const fx=whipFx.get(id); if(!fx)return null;
  const age=now-fx.started;
  if(age>=WHIP_MS){whipFx.delete(id);return null}
  const reactAge=Math.max(0,age-190);
  const jumpAge=Math.min(reactAge,850), jump=-Math.sin((jumpAge/850)*Math.PI)*3.6;
  const shake=reactAge>0&&reactAge<480?(((frame>>1)%2)?-0.8:0.8):0;
  return {fx,age,dx:shake,dy:jump};
}
function drawWhipFx(c,pose){
  if(!pose)return;
  const {fx,age}=pose;
  ctx.save();
  if(age<1050){
    // Three phases: coiled wind-up, supersonic snap, then damped recoil.
    const wind=Math.min(1,age/190);
    const snap=Math.max(0,Math.min(1,(age-190)/230));
    const recoil=Math.max(0,Math.min(1,(age-420)/630));
    const eased=1-Math.pow(1-snap,3);
    const hx=fx.fromX*S,hy=fx.fromY*S;
    const tx=(c.x+3)*S,ty=(c.y+5)*S;
    const tipX=(fx.fromX+3+(c.x-fx.fromX)*eased)*S;
    const tipY=(fx.fromY-3+(c.y+5-fx.fromY)*eased)*S;
    const wave=(1-recoil)*Math.sin(recoil*Math.PI*5)*3*S;

    // Leather handle, hand guard, and bright brass pommel.
    ctx.lineCap="round";
    ctx.strokeStyle="#26150f";ctx.lineWidth=Math.max(4,S*1.8);
    ctx.beginPath();ctx.moveTo(hx-4*S,hy+4*S);ctx.lineTo(hx,hy);ctx.stroke();
    ctx.strokeStyle="#8d5524";ctx.lineWidth=Math.max(2,S);
    ctx.beginPath();ctx.moveTo(hx-4*S,hy+4*S);ctx.lineTo(hx,hy);ctx.stroke();
    ctx.fillStyle="#e8c170";ctx.fillRect(hx-4.7*S,hy+3.7*S,S,S);

    const drawRope=(color,width)=>{
      ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(hx,hy);
      if(snap<=0){
        const loop=wind*Math.PI;
        ctx.bezierCurveTo(
          hx-10*S*Math.sin(loop),hy-13*S*wind,
          hx+13*S*wind,hy-15*S*wind,
          hx+4*S,hy-4*S
        );
      }else{
        ctx.bezierCurveTo(
          hx+7*S,hy-15*S+wave,
          tipX-10*S,tipY+12*S-wave,
          tipX,tipY
        );
        if(snap>=1)ctx.quadraticCurveTo(tx-2*S,ty-3*S-wave*.3,tx,ty);
      }
      ctx.stroke();
    };
    drawRope("#21150f",Math.max(3,S*1.1));
    drawRope(age<430?"#f6e7bd":"#c89b54",Math.max(1.25,S*.45));

    // Motion streaks make the accelerating tip read as a sharp crack.
    if(age>240&&age<520){
      const alpha=1-(age-240)/280;ctx.globalAlpha=alpha;
      ctx.strokeStyle="#fff3c8";ctx.lineWidth=1;
      for(let i=0;i<3;i++){
        ctx.beginPath();ctx.moveTo(tx-(8+i*3)*S,ty-(7-i*2)*S);
        ctx.lineTo(tx-(2+i)*S,ty-(2-i)*S);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    if(age>300&&age<720){
      const fade=1-(age-300)/420;ctx.globalAlpha=Math.max(0,fade);
      ctx.fillStyle="#ffcf5c";
      const burst=[[0,-2],[2,-3],[3,0],[2,3],[-1,2],[-2,0]];
      burst.forEach(([x,y],i)=>ctx.fillRect(
        (c.x+4+x*(1.5+i*.1))*S,(c.y+3+y*(1.5+i*.08))*S,S,S
      ));
      ctx.globalAlpha=1;
    }
  }
  if(age>280&&age<1900){
    const text=fx.label;
    ctx.font=`bold ${Math.max(10,S*2.6)}px ui-monospace,monospace`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    const cx=(c.x+4)*S, cy=(c.y-7)*S;
    const bw=ctx.measureText(text).width+12, bh=Math.max(17,S*4.2);
    ctx.fillStyle="rgba(20,14,28,.92)";ctx.fillRect(cx-bw/2,cy-bh/2,bw,bh);
    ctx.strokeStyle="#ffcf5c";ctx.lineWidth=1;
    ctx.strokeRect(cx-bw/2+.5,cy-bh/2+.5,bw-1,bh-1);
    ctx.fillStyle="#fff0c2";ctx.fillText(text,cx,cy+1);
  }
  ctx.restore();
}

// ── seats + walking ─────────────────────────────────────────────────────
// chars: id → {x,y, seat:{x,y}, phase:"in"|"seated"|"out", lastStatus}
const chars = new Map();
const WALK = 0.55;                                  // grid cells per frame
const tek={x:0,y:0,phase:"home",targetId:null,nextAt:performance.now()+5000,returnAt:0,initialized:false};
let patrolIndex=0;
function seatPos(i,perRow){
  return {x:10+(i%perRow)*34, y:14+Math.floor(i/perRow)*32};
}
function moveToward(o,tx,ty,speed=.32){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
  if(d<=speed){o.x=tx;o.y=ty;return true}o.x+=dx/d*speed;o.y+=dy/d*speed;return false}
function sendTeknium(target,c,now){
  const quip=WHIP_LINES[patrolIndex++%WHIP_LINES.length];
  whipCount++;whipFx.set(target.id,{started:now,label:quip.bubble,fromX:tek.x+8,fromY:tek.y+8});
  primeAudio();setTimeout(sharpCrack,190);setTimeout(()=>speakWhip(quip),470);syncWhipBtn();
  tek.phase="victory";tek.returnAt=now+1500;
}
function updateNpcs(gw,gh,now){
  const homeX=Math.max(18,gw-31),homeY=Math.max(9,gh-26);
  if(!tek.initialized){tek.x=homeX;tek.y=homeY;tek.initialized=true}
  const available=agents.filter(a=>{const c=chars.get(a.id);return c&&c.phase==="seated"});
  if(tek.phase==="home"){
    moveToward(tek,homeX,homeY);
    if(now>=tek.nextAt&&available.length){tek.targetId=available[patrolIndex%available.length].id;tek.phase="patrol"}
  }else if(tek.phase==="patrol"){
    const target=agents.find(a=>a.id===tek.targetId),c=target&&chars.get(target.id);
    if(!target||!c){tek.phase="return"}
    else if(moveToward(tek,c.x+11,c.y+1,.38))sendTeknium(target,c,now);
  }else if(tek.phase==="victory"){
    if(now>=tek.returnAt)tek.phase="return";
  }else if(tek.phase==="return"&&moveToward(tek,homeX,homeY,.34)){
    tek.phase="home";tek.targetId=null;tek.nextAt=now+9000;
  }
  drawNousGirl(Math.max(27,gw-19),Math.max(9,gh-26));
  npcLabel("NOUS GIRL",Math.max(31,gw-15),Math.max(23,gh-9),"#bda7ff");
  drawTeknium(tek.x,tek.y,tek.phase==="patrol"||tek.phase==="return");
  npcLabel(tek.phase==="home"?"TEKNIUM · CHILLING":"TEKNIUM · MANAGEMENT",tek.x+4,tek.y+17,"#49e893");
}
function stepChars(perRow){
  const seen=new Set();
  agents.forEach((a,i)=>{
    seen.add(a.id);
    const seat=seatPos(i,perRow);
    let c=chars.get(a.id);
    if(!c){ c={x:2,y:2,seat,phase:"in",lastStatus:a.status}; chars.set(a.id,c); }
    c.seat=seat;
    const tx=c.phase==="out"?2:c.seat.x+2, ty=c.phase==="out"?2:c.seat.y;
    const dx=tx-c.x, dy=ty-c.y, d=Math.hypot(dx,dy);
    if(d<WALK){ c.x=tx;c.y=ty; if(c.phase==="in")c.phase="seated"; }
    else { c.x+=dx/d*WALK; c.y+=dy/d*WALK; }
    // sound triggers on status transitions
    if(c.lastStatus!==a.status){
      if(a.status==="waiting")chime([880,660,880]);
      else if(a.status==="done"&&a.kind==="subagent")chime([520,780]);
      c.lastStatus=a.status;
    }
  });
  for(const [id,c] of chars){
    if(!seen.has(id)){
      c.phase="out";
      const dx=2-c.x, dy=2-c.y, d=Math.hypot(dx,dy);
      if(d<WALK)chars.delete(id);
      else{c.x+=dx/d*WALK;c.y+=dy/d*WALK;}
    }
  }
}

// ── sound (off by default; toggle persists) ─────────────────────────────
let soundOn=false, voiceOn=false, audioCtx=null, voiceAudio=null;
try{soundOn=localStorage.getItem("pixelOfficeSound")==="1"}catch(e){}
try{voiceOn=localStorage.getItem("pixelOfficeVoice")==="1"}catch(e){}
function chime(notes){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type="square";o.frequency.value=f;
      g.gain.setValueAtTime(0.06,audioCtx.currentTime+i*0.12);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+i*0.12+0.11);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+i*0.12);o.stop(audioCtx.currentTime+i*0.12+0.12);
    });
  }catch(e){}
}
function sharpCrack(){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const sr=audioCtx.sampleRate,dur=.19;
    const buf=audioCtx.createBuffer(1,Math.ceil(sr*dur),sr),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){
      const t=i/sr;
      const primary=Math.exp(-t*95);
      const echo1=t>.025?Math.exp(-(t-.025)*135)*.58:0;
      const echo2=t>.061?Math.exp(-(t-.061)*180)*.3:0;
      d[i]=(Math.random()*2-1)*(primary+echo1+echo2);
    }
    const src=audioCtx.createBufferSource(),hp=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
    src.buffer=buf;hp.type="highpass";hp.frequency.value=1650;hp.Q.value=.72;
    g.gain.setValueAtTime(.34,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    src.connect(hp);hp.connect(g);g.connect(audioCtx.destination);src.start();

    // A tiny low-frequency body beneath the sharp transient.
    const thump=audioCtx.createOscillator(),tg=audioCtx.createGain();
    thump.type="triangle";thump.frequency.setValueAtTime(115,audioCtx.currentTime);
    thump.frequency.exponentialRampToValueAtTime(52,audioCtx.currentTime+.075);
    tg.gain.setValueAtTime(.11,audioCtx.currentTime);
    tg.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.08);
    thump.connect(tg);tg.connect(audioCtx.destination);
    thump.start();thump.stop(audioCtx.currentTime+.085);
  }catch(e){}
}
function primeAudio(){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
  }catch(e){}
}
const sBtn=document.getElementById("sound");
function syncSoundBtn(){sBtn.textContent=soundOn?"♪ sound on":"♪ sound off";
  sBtn.classList.toggle("on",soundOn)}
sBtn.onclick=()=>{soundOn=!soundOn;
  try{localStorage.setItem("pixelOfficeSound",soundOn?"1":"0")}catch(e){}
  if(soundOn)chime([660]); syncSoundBtn()};
syncSoundBtn();

const voiceBtn=document.getElementById("voice");
function syncVoiceBtn(){
  voiceBtn.textContent=voiceOn?"🗣 voice on":"🗣 voice off";
  voiceBtn.classList.toggle("voice-on",voiceOn);
}
function speakWhip(quip){
  if(!voiceOn)return;
  try{
    if(voiceAudio){voiceAudio.pause();voiceAudio.currentTime=0}
    voiceAudio=new Audio(`audio/${quip.audio}.mp3`);
    voiceAudio.volume=.88;
    const played=voiceAudio.play();
    if(played)played.catch(()=>browserVoice(quip.voice));
  }catch(e){browserVoice(quip.voice)}
}
function browserVoice(text){
  if(typeof speechSynthesis==="undefined"||typeof SpeechSynthesisUtterance==="undefined")return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
    u.rate=.96;u.pitch=.68;u.volume=.82;speechSynthesis.speak(u)}catch(e){}
}
function primeVoice(){
  try{const a=new Audio("audio/bodyless-comedy.mp3");a.muted=true;
    const p=a.play();if(p)p.then(()=>{a.pause();a.currentTime=0}).catch(()=>{})}catch(e){}
}
voiceBtn.onclick=()=>{voiceOn=!voiceOn;
  try{localStorage.setItem("pixelOfficeVoice",voiceOn?"1":"0")}catch(e){}
  syncVoiceBtn();
  if(voiceOn)primeVoice();
};
syncVoiceBtn();

const whipBtn=document.getElementById("whip");
function syncWhipBtn(){
  whipBtn.textContent=whipArmed?"🐴 whip armed":(whipCount?`🐴 whip ×${whipCount}`:"🐴 whip");
  whipBtn.classList.toggle("whip-on",whipArmed);
  cv.style.cursor=whipArmed?"crosshair":"default";
}
whipBtn.onclick=()=>{whipArmed=!whipArmed;syncWhipBtn()};
cv.addEventListener("click",ev=>{
  if(!whipArmed)return;
  const r=cv.getBoundingClientRect();
  const gx=(ev.clientX-r.left)*(cv.width/r.width)/S;
  const gy=(ev.clientY-r.top)*(cv.height/r.height)/S;
  let target=null,targetChar=null;
  for(let i=agents.length-1;i>=0;i--){
    const a=agents[i],c=chars.get(a.id);if(!c||c.phase!=="seated")continue;
    const seat=c.seat;
    if(gx>=seat.x-2&&gx<=seat.x+19&&gy>=seat.y-8&&gy<=seat.y+27){
      target=a;targetChar=c;break;
    }
  }
  if(!target||!targetChar)return;
  whipCount++;
  const quip=WHIP_LINES[Math.floor(Math.random()*WHIP_LINES.length)];
  whipFx.set(target.id,{
    started:performance.now(),
    label:quip.bubble,
    fromX:Math.max(3,targetChar.x-11),fromY:targetChar.y+14
  });
  primeAudio(); // inside the click gesture, so the delayed crack is not autoplay-blocked
  setTimeout(sharpCrack,190);
  setTimeout(()=>speakWhip(quip),470);
  syncWhipBtn();
});
syncWhipBtn();

// ── + agent button (VS Code only) ───────────────────────────────────────
const spawnBtn=document.getElementById("spawn");
if(IN_VSCODE){spawnBtn.style.display="";
  spawnBtn.onclick=()=>vsapi.postMessage({type:"spawnAgent"});}

// ── render loop ─────────────────────────────────────────────────────────
function render(){
  frame++;
  const now=performance.now();
  const W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  // auto-shrink pixels if the office is crowded
  const rowsAt=s=>Math.ceil(agents.length/Math.max(1,Math.floor((W/s-8)/34)));
  S=4; while(S>2 && 14+rowsAt(S)*32*S>H-8*S && agents.length) S--;
  const gw=Math.floor(W/S),gh=Math.floor(H/S);
  drawOffice(gw,gh);
  const perRow=Math.max(1,Math.floor((gw-(gw>55?38:8))/34));
  stepChars(perRow);
  agents.forEach((a,i)=>{
    const seat=seatPos(i,perRow);
    drawDesk(seat.x,seat.y); deskScreen(seat.x,seat.y,a);
  });
  agents.forEach((a,i)=>{
    const c=chars.get(a.id); if(!c)return;
    const seated=c.phase==="seated";
    const pose=whipPose(a.id,now);
    drawChar(a,c.x+(pose?pose.dx:0),c.y+(pose?pose.dy:0),seated);
    drawWhipFx(c,pose);
    if(seated){const seat=seatPos(i,perRow);
      drawBubble(a,seat.x+2,seat.y); label(a,seat.x,seat.y);}
  });
  // walking-out ghosts
  for(const [id,c] of chars){
    if(c.phase==="out"&&!agents.find(a=>a.id===id))
      drawChar({id,kind:"main",status:"gone",activity:""},c.x,c.y,false);
  }
  updateNpcs(gw,gh,now);
  ctx.font="13px ui-monospace";ctx.textAlign="center";
  if(offline){
    ctx.fillStyle="#d84f6f";
    ctx.fillText("hermes office unreachable — "+offline,W/2,H/2);
    ctx.fillStyle="#7a6f8f";
    ctx.fillText("enable with: hermes plugins enable pixel-office, then run a session",W/2,H/2+20);
  }else if(!agents.length){
    ctx.fillStyle="#7a6f8f";
    ctx.fillText("office is empty — run something in Hermes ☤",W/2,H/2);
  }
  requestAnimationFrame(render);
}

// ── data feed: postMessage (VS Code) or poll /state (browser) ───────────
function applyState(state){
  offline=null; agents=(state&&state.agents)||[];
  const n=agents.length, w=agents.filter(a=>a.status==="waiting").length;
  document.getElementById("count").textContent=
    n+" agent"+(n===1?"":"s")+(w?" · "+w+" waiting!":"");
}
if(IN_VSCODE){
  window.addEventListener("message",(ev)=>{
    const m=ev.data||{};
    if(m.type==="state")applyState(m.state);
    else if(m.type==="offline"){offline=m.url;agents=[];
      document.getElementById("count").textContent="offline";}
  });
}else{
  (async function poll(){
    try{const r=await fetch("state");applyState(await r.json());}
    catch(e){offline=String(location.host);agents=[];
      document.getElementById("count").textContent="offline";}
    setTimeout(poll,1500);
  })();
}
render();
</script>
