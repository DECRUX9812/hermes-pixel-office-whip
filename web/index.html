<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Office — Hermes Agent Office</title>
<style>
  :root {
    --bg: #0d0f14; --panel: #151923; --panel2: #1b2130;
    --text: #e6e9f2; --dim: #8b93a7; --faint: #565e73;
    --gold: #e8b34b; --emerald: #3ddc97; --red: #ff5c6c;
    --blue: #5aa7ff; --purple: #b48cff; --stroke: #262d40;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; padding: 20px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  header h1 { font-size: 18px; letter-spacing: .04em; }
  header h1 .accent { color: var(--gold); }
  .stats { color: var(--dim); font-size: 12.5px; font-family: var(--mono); }
  .grow { flex: 1; }
  .whipbtn {
    background: linear-gradient(180deg, #3a2b12, #241a0c); color: var(--gold);
    border: 1px solid var(--gold); border-radius: 8px; padding: 8px 18px;
    font: 700 14px/1 var(--mono); letter-spacing: .08em; cursor: pointer;
    transition: transform .08s, box-shadow .15s;
  }
  .whipbtn:hover { box-shadow: 0 0 18px rgba(232,179,75,.35); }
  .whipbtn:active { transform: scale(.96); }
  .whipbtn.flash { animation: flash .45s; }
  @keyframes flash { 0% { box-shadow: 0 0 0 rgba(232,179,75,0);} 30% { box-shadow: 0 0 34px rgba(232,179,75,.9);} 100% { box-shadow: 0 0 0 rgba(232,179,75,0);} }

  #crack-banner {
    display: none; background: var(--panel2); border: 1px solid var(--gold);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px;
  }
  #crack-banner.show { display: block; animation: crackin .35s; }
  @keyframes crackin { from { opacity: 0; transform: translateY(-6px);} to { opacity: 1; transform: none;} }
  #crack-banner .line { color: var(--gold); font-weight: 700; }
  #crack-banner .meta { color: var(--dim); font-size: 12px; font-family: var(--mono); margin-top: 3px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 10px;
    padding: 12px 14px; position: relative; overflow: hidden;
  }
  .card.working { border-color: #2c4a6e; }
  .card.waiting { border-color: #6e5a2c; }
  .card.whipped::after {
    content: "💥"; position: absolute; top: 8px; right: 10px; font-size: 18px;
    animation: pop .4s;
  }
  @keyframes pop { from { transform: scale(0);} 60% { transform: scale(1.5);} to { transform: scale(1);} }
  .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
  .working .dot { background: var(--blue); animation: pulse 1.2s infinite; }
  .thinking .dot { background: var(--purple); animation: pulse 2s infinite; }
  .waiting .dot { background: var(--gold); }
  .idle .dot { background: var(--faint); }
  .done .dot { background: var(--emerald); }
  @keyframes pulse { 50% { opacity: .35; } }
  .card .label { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    font: 600 10px/1 var(--mono); letter-spacing: .06em; padding: 3px 7px; border-radius: 5px;
    background: var(--panel2); color: var(--dim); text-transform: uppercase; flex: none;
  }
  .badge.sub { color: var(--purple); }
  .card .status { font: 600 12px/1 var(--mono); margin-bottom: 5px; }
  .working .status { color: var(--blue); }
  .thinking .status { color: var(--purple); }
  .waiting .status { color: var(--gold); }
  .idle .status { color: var(--faint); }
  .done .status { color: var(--emerald); }
  .gone .status { color: var(--faint); }
  .card .tool { font-family: var(--mono); font-size: 12px; color: var(--text); margin-bottom: 3px; }
  .card .detail { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--faint); padding: 40px; text-align: center; font-size: 14px; }
  footer { margin-top: 22px; color: var(--faint); font-size: 11.5px; font-family: var(--mono); display: flex; gap: 16px; flex-wrap: wrap; }
  footer .conn-ok { color: var(--emerald); } footer .conn-bad { color: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PIXEL <span class="accent">OFFICE</span> · hermes agent office</h1>
    <span class="stats" id="stats">— agents · — whips</span>
    <span class="grow"></span>
    <button class="whipbtn" id="whipbtn" title="Crack the whip at lazy agents">🪄 CRACK THE WHIP</button>
  </header>

  <div id="crack-banner"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No agents in the office yet — start a Hermes session and they'll walk in.</div>

  <footer>
    <span id="conn">connecting…</span>
    <span>state: ~/.hermes/pixel-office/events.jsonl</span>
    <span>slash: /whip · cli: hermes office</span>
  </footer>
</div>

<script>
"use strict";
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const stats = document.getElementById("stats");
const conn = document.getElementById("conn");
const banner = document.getElementById("crack-banner");
const whipbtn = document.getElementById("whipbtn");
let lastWhipTs = 0, whipFlashAt = 0;

function ago(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  return Math.floor(s / 3600) + "h";
}
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function card(a, now) {
  const whipped = a.whipped_at && (now - a.whipped_at) < 15;
  const kind = a.kind === "subagent" ? '<span class="badge sub">sub</span>' : "";
  return '<div class="card ' + esc(a.status) + (whipped ? " whipped" : "") + '">'
    + '<div class="top"><span class="dot"></span><span class="label">' + esc(a.label) + "</span>" + kind + "</div>"
    + '<div class="status">' + esc(a.status || "idle") + "</div>"
    + (a.tool ? '<div class="tool">' + esc(a.tool) + "</div>" : "")
    + '<div class="detail">' + esc(a.detail || "") + "</div>"
    + "</div>";
}

async function poll() {
  try {
    const r = await fetch("state", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const st = await r.json();
    conn.textContent = "● live"; conn.className = "conn-ok";
    const now = st.ts || Date.now() / 1000;
    grid.innerHTML = st.agents.map(a => card(a, now)).join("");
    empty.style.display = st.agents.length ? "none" : "block";
    stats.textContent = st.agents.length + " agent" + (st.agents.length === 1 ? "" : "s")
      + " · " + (st.whip && st.whip.count || 0) + " whip cracks";
    if (st.whip && st.whip.last && st.whip.last.ts > lastWhipTs) {
      lastWhipTs = st.whip.last.ts;
      const lw = st.whip.last;
      banner.innerHTML = '<span class="line">💥 CRACK! “' + esc(lw.line) + '”</span>'
        + '<div class="meta">' + esc(lw.by)
        + (lw.target ? " → " + esc(lw.target) : "")
        + " · " + ago(lw.ts) + " ago</div>";
      banner.classList.remove("show"); void banner.offsetWidth;
      banner.classList.add("show");
    }
  } catch (e) {
    conn.textContent = "○ offline (" + e.message + ")"; conn.className = "conn-bad";
  }
}

async function whip() {
  whipbtn.classList.remove("flash"); void whipbtn.offsetWidth;
  whipbtn.classList.add("flash");
  try {
    const r = await fetch("whip", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ by: "web office", target: "" }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const p = await r.json();
    banner.innerHTML = '<span class="line">💥 CRACK! “' + esc(p.line) + '”</span>'
      + '<div class="meta">' + esc(p.by) + " · just now</div>";
    banner.classList.remove("show"); void banner.offsetWidth;
    banner.classList.add("show");
    lastWhipTs = Date.now() / 1000;
    poll();
  } catch (e) {
    conn.textContent = "○ whip failed (" + e.message + ")"; conn.className = "conn-bad";
  }
}
whipbtn.addEventListener("click", whip);

poll();
setInterval(poll, 2500);
</script>
</body>
</html>
